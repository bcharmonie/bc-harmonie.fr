<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BC Harmonie — Contact</title>
  <meta name="robots" content="noindex,nofollow" />
  <style>
    :root{
      --bg:#0f1114;
      --fg:#f2f2f2;
      --muted:#a9a9a9;
      --field:#1b1f24;
      --border:rgba(255,255,255,.12);
      --borderStrong:rgba(255,255,255,.35);
    }
    body{
      margin:0;
      background:var(--bg);
      color:var(--fg);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    .wrap{
      max-width:720px;
      margin:0 auto;
      padding: 28px 18px 40px;
    }
    a.back{
      display:inline-block;
      color:var(--muted);
      text-decoration:none;
      margin-bottom:18px;
    }
    h1{
      font-size: clamp(28px, 6vw, 44px);
      line-height:1.05;
      margin: 8px 0 12px;
      font-weight:700;
      letter-spacing:-.02em;
    }
    p{
      margin:0 0 22px;
      color:var(--muted);
      font-size: 16px;
    }
    label{
      display:block;
      margin: 16px 0 8px;
      color: var(--muted);
      font-size: 14px;
      letter-spacing:.02em;
    }
    input, textarea{
      width:100%;
      box-sizing:border-box;
      background:var(--field);
      border:1px solid var(--border);
      color:var(--fg);
      padding:14px 14px;
      border-radius:10px;
      outline:none;
      font-size:16px;
    }
    textarea{ min-height:160px; resize:vertical; }
    .btn{
      margin-top:18px;
      display:inline-block;
      padding: 14px 18px;
      border-radius: 12px;
      background: transparent;
      color: var(--fg);
      border:1px solid var(--borderStrong);
      font-weight:700;
      letter-spacing:.12em;
      text-transform:uppercase;
      cursor:pointer;
    }
    .btn:active{ transform: translateY(1px); }
    .msg{
      display:none;
      margin-top:16px;
      padding:12px 14px;
      border-radius:10px;
      border:1px solid var(--border);
      background: rgba(255,255,255,.03);
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="wrap">
    <a class="back" href="/">← Retour</a>

    <h1>Nous contacter</h1>
    <p>Décrivez votre besoin (agencement, cuisine, rangements…). Nous revenons vers vous rapidement.</p>

    <form id="contactForm" action="https://formspree.io/f/xnjbzeaq" method="POST">
      <label for="name">Nom</label>
      <input id="name" name="name" type="text" autocomplete="name" required>

      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" autocomplete="email" required>

      <label for="message">Message</label>
      <textarea id="message" name="message" required></textarea>

      <!-- Anti-spam “honeypot” -->
      <input type="text" name="_gotcha" style="display:none">

      <button class="btn" type="submit">Envoyer</button>

      <div class="msg" id="ok">Message envoyé. Merci.</div>
      <div class="msg" id="err">Envoi impossible pour le moment. Réessayez plus tard.</div>
    </form>
  </main>

  <script>
    const form = document.getElementById('contactForm');
    const ok = document.getElementById('ok');
    const err = document.getElementById('err');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      ok.style.display = 'none';
      err.style.display = 'none';

      try {
        const res = await fetch(form.action, {
          method: 'POST',
          body: new FormData(form),
          headers: { 'Accept': 'application/json' }
        });

        if (res.ok) {
          form.reset();
          ok.style.display = 'block';
        } else {
          err.style.display = 'block';
        }
      } catch {
        err.style.display = 'block';
      }
    });
  </script>
</body>
</html>
