<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BC Harmonie — En construction</title>
  <meta name="robots" content="noindex,nofollow" />

  <style>
    :root{
      --graphite:#242421;
      --offwhite:#ede9e1;
      --bronze:#8a6a3e; /* sous le coude */
      --muted: rgba(237,233,225,.72);
      --border: rgba(237,233,225,.25);
    }

    body{
      border-top: 2px solid var(--bronze);
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background: var(--graphite);
      color: var(--offwhite);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    .wrap{
      width:min(820px, 92vw);
      text-align:center;
      padding: 28px 18px 34px;
    }

    .logo{
      width: min(560px, 86vw);
      height:auto;
      display:block;
      margin: 0 auto 18px;
    }

    .tag{
      margin-top: 30px;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    .actions{
      margin-top: 24px;
      display:flex;
      gap:12px;
      justify-content:center;
      flex-wrap:wrap;
    }

    a.btn{
      display:inline-block;
      padding: 12px 18px;
      border-radius: 999px;
      background: transparent;
      color: var(--offwhite);
      text-decoration:none;
      font-weight: 650;
      border: 1px solid var(--border);
      letter-spacing: .06em;
      text-transform: uppercase;
      font-size: 13px;
    }
    a.btn:hover{
      border-color: rgba(237,233,225,.55);
    }

    .fine{
      margin-top: 16px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <main class="wrap">
    <img class="logo" src="logo-clair.png" alt="BC Harmonie">

    

    <div class="actions">
      <a class="btn" href="/contact.html">Contact</a>
    </div>

    <div class="fine">
      
    </div>
    <div class="tag">Site en construction</div>
  </main>
</body>
</html>
